rink:0;border:2px solid var(--part-color);border-radius:7px;font-size:11px;font-weight:700;background:white}.layer-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis}.layer-name small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.flag{width:6px;height:6px;border-radius:50%;background:#cfb05e}.flag.accepted{background:#379078}.flag.needs_repair{background:#d26c60}.hint{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;color:var(--muted);font-size:11px;line-height:1.9}.center{min-width:0;display:flex;flex-direction:column;overflow:hidden}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding:11px 13px;background:#f7faf6;border-bottom:1px solid var(--line)}.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tools button{padding:6px 9px}.tools label{font-size:11px;display:flex;gap:5px;align-items:center}.tools input[type=range]{width:70px;accent-color:var(--green)}#viewport{position:relative;overflow:hidden;flex:1;min-height:320px;touch-action:none;cursor:grab}.checker{background-color:#e9eee6;background-image:linear-gradient(45deg,#dfe6dc 25%,transparent 25%),linear-gradient(-45deg,#dfe6dc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dfe6dc 75%),linear-gradient(-45deg,transparent 75%,#dfe6dc 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}#canvas{position:absolute;inset:0;width:100%;height:100%}#note{padding:9px 14px;background:#fff5df;color:#876b38;line-height:1.7;font-size:11px;border-bottom:1px solid #eaddba}#canvasFooter{display:flex;justify-content:space-between;gap:15px;background:#f9fbf7;border-top:1px solid var(--line);padding:10px 14px;font-size:11px;color:var(--muted)}label.field{display:block;font-size:11px;color:#6a7e70;margin:12px 0}label.field input,label.field select,label.field textarea{display:block;width:100%;margin-top:6px;border:1px solid #d7e2d7;padding:8px;border-radius:6px;background:white;color:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair button{font-size:12px}.preview{width:100%;height:138px;border:1px solid var(--line);border-radius:8px;margin:10px 0}#color{height:34px;padding:3px}textarea{resize:vertical;min-height:56px}.right hr{border:0;border-top:1px solid var(--line);margin:18px 0}.face-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.face-card{border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;text-align:center;font-size:11px}.face-card canvas{display:block;width:100%;height:105px}.face-card span{display:block;padding:8px 3px}.face-note{font-size:11px;line-height:1.8;color:#788575}footer{height:41px;border-top:1px solid var(--line);padding:10px 24px;display:flex;justify-content:space-between;gap:15px;background:white;color:var(--muted);font-size:11px}#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}[hidden]{display:none!important}:focus-visible{outline:2px solid #5c9b7e;outline-offset:2px}@media(max-width:1150px){.layout{grid-template-columns:220px minmax(280px,1fr) 260px}.panel{padding:14px 11px}h1 small{display:block;margin-bottom:5px}}@media(max-width:780px){header{align-items:flex-start;flex-direction:column;padding:14px 15px}.checkpoint{padding:10px 15px;flex-direction:column;align-items:flex-start}.layout{height:auto;min-height:0;grid-template-columns:1fr 1fr}.center{grid-column:1/-1;grid-row:1;height:65dvh}.panel{max-height:650px;border-top:1px solid var(--line)}.right{border-left:0}.left{border-right:1px solid var(--line)}footer{height:auto;padding:10px 15px}.face-cards{grid-template-columns:1fr}.pair{grid-template-columns:1fr}}

<body>
<header><div><h1><small>CHARACTER LAB / 02</small>角色切片 · 图层检查台</h1><div class="muted" id="title">按轮廓识别每一层，按顺序还原角色。</div></div><div class="actions"><button id="import">导入 JSON</button><button id="export">导出 JSON</button><button id="savePage">保存网页</button><button id="exportView">保存标注图</button></div></header>
<div class="checkpoint" id="checkpointBar"><div><strong id="checkpointState">载入中</strong><div class="muted" id="checkpointDetail"></div></div><button class="primary" id="confirmStage" disabled>确认切片与表情拆分</button></div>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>
<main class="layout">
<aside class="panel left"><div class="section"><span>图层顺序</span><span class="badge" id="count"></span></div><div class="small">列表上方在前 · 编号 1 在最后</div><div id="layerList"></div><div class="hint">颜色沿 PNG 的透明轮廓标注。<br>数字表示当前绘制顺序，不是固定部件 ID。<br><br>拖动空白处平移 · 滚轮缩放<br>点击图形或列表选择部件<br>「编辑轮廓」可用画笔调整接缝<br>「仅看此层」可检查碎片和接缝</div></aside>
<section class="center"><div class="toolbar"><div class="tools"><button id="overlayMode" class="active">彩色轮廓</button><button id="originalMode">原图</button><button id="compositeMode">切片合成</button><button id="numbers" class="active">编号</button><button id="solo">仅看此层</button><button id="editMask" aria-pressed="false">编辑轮廓</button></div><div class="tools"><label>叠色<input id="opacity" type="range" min="0" max="0.8" value="0.3" step="0.05"></label><button id="undo">撤销</button><button id="redo">重做</button><button id="zoomOut">−</button><span class="small" id="zoom"></span><button id="zoomIn">＋</button><button id="fit">全图</button><button id="zoomFace">面部</button></div></div><div id="maskTools" class="mask-tools" hidden><button id="brushAdd" class="active">扩入当前层</button><button id="brushErase">划给相邻层</button><label>相邻部件<select id="maskNeighbor"></select></label><label>画笔直径<input id="brushSize" type="range" min="2" max="80" value="16" step="1"><span id="brushSizeLabel">16 px</span></label><div class="mask-help" id="maskHelp"></div></div><div id="note" hidden></div><div id="viewport" class="checker"><canvas id="canvas" aria-label="按部件外形着色并带图层编号的角色预览"></canvas><div id="brushCursor" hidden></div></div><div id="canvasFooter"><span id="dimensions"></span><span id="modeLabel">编号由后到前递增</span></div></section>
<aside class="panel right"><div class="section"><span id="selectedTitle">部件检查</span><span class="badge" id="selectedNumber"></span></div><canvas id="partPreview" class="preview checker"></canvas><div class="small" id="partInfo"></div><label class="field">名称<input id="label"></label><div class="pair"><label class="field">轮廓颜色<input id="color" type="color"></label><label class="field">检查状态<select id="quality"><option value="pending">待检查</option><option value="accepted">已检查</option><option value="needs_repair">需要修正</option></select></label></div><div class="pair"><button id="forward">向前一层 ↑</button><button id="backward">向后一层 ↓</button></div><label class="field">问题与备注<textarea id="partNote" placeholder="例如：袖口混入皮肤，需要修正蒙版"></textarea></label><div class="pair"><button id="downloadPart">下载此层 PNG</button><button id="fitPart">放大此层</button></div><hr><div class="section">空面部与表情</div><div class="face-cards"><button class="face-card" id="blankFace"><canvas id="blankPreview" class="checker"></canvas><span>空面部 · 单独查看</span></button><button class="face-card" id="expressionFace"><canvas id="expressionPreview" class="checker"></canvas><span>独立表情 · 单独查看</span></button></div><p class="face-note" id="faceInfo"></p><button id="restoreFace">重新叠回表情</button><p class="face-note">确认前检查：空面部没有原眼睛、眉毛和嘴的残留；底色不透明，脸型与明暗自然。表情拆回后应与原图对齐。</p></aside>
</main><footer><span id="status" role="status" aria-live="polite">正在载入切片…</span><span id="saveHint">图片在本地处理</span></footer>
<script id="rig-data" type="application/json">null</script>
<script id="checkpoint-config" type="application/json">null</script>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o));
let data=JSON.parse($('rig-data').textContent),config=JSON.parse($('checkpoint-config').textContent);
if(!data){$('checkpointState').textContent='等待生成角色切片';$('checkpointDetail').textContent='请使用本 skill 的生成器加载图片和切片结果。';return;}
let selected=data.order.at(-1),mode='overlay',solo=false,showNumbers=true,scale=1,pan={x:0,y:0},fitView=true,roi=null,assets={},original=null,undo=[],redo=[],dirty=false,gesture=null,revision=config?.revision??0,reviewState=config?.status||'offline',pending=0,error='',queue=Promise.resolve(),editVersion=0,lastSize=null;
let maskEditing=false,brushAction='add',neighbor='',stroke=null,assetBusy=false,brushPosition=null,faceUnderlay=null;
const canvas=$('canvas'),ctx=canvas.getContext('2d'),viewport=$('viewport');
const current=()=>data.parts.find(p=>p.id===selected),ordered=()=>data.order.map(id=>data.parts.find(p=>p.id===id));
function status(s){$('status').textContent=s;}
function load(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('无法载入切片图片'));im.src=src;});}
function validate(d){if(!d||d.schema_version!==1||!d.image||!Array.isArray(d.nodes)||!Array.isArray(d.parts)||!Array.isArray(d.order))throw Error('切片数据格式不完整');const ids=d.parts.map(p=>p.id);if(new Set(ids).size!==ids.length||d.order.length!==ids.length||new Set(d.order).size!==ids.length||d.order.some(id=>!ids.includes(id)))throw Error('图层顺序必须完整且无重复');if(!d.face||!ids.includes(d.face.base_part)||!Array.isArray(d.face.feature_ids)||!d.face.feature_ids.length)throw Error('需要空面部和独立表情图层');for(const id of d.face.feature_ids)if(!ids.includes(id)||d.order.indexOf(id)<=d.order.indexOf(d.face.base_part))throw Error('表情必须在空面部之上');for(const p of d.parts)if(!/^#[0-9a-f]{6}$/i.test(p.color)||!['pending','accepted','needs_repair'].includes(p.quality)||!/^data:image\/png;base64,/.test(p.src||''))throw Error('图层属性无效');return d;}
function tint(image,color){const c=document.createElement('canvas');c.width=image.width;c.height=image.height;const x=c.getContext('2d');x.drawImage(image,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);return c;}
async function loadAssets(){original=await load(data.image.src);if(original.naturalWidth!==data.image.width||original.naturalHeight!==data.image.height)throw Error('原图尺寸与坐标不匹配');const next={};await Promise.all(data.parts.map(async p=>{const [image,outline]=await Promise.all([load(p.src),load(p.outline_src)]);if(image.naturalWidth!==p.w||image.naturalHeight!==p.h)throw Error('切片尺寸错误：'+p.id);const c=document.createElement('canvas');c.width=p.w;c.height=p.h;const x=c.getContext('2d');x.drawImage(image,0,0);next[p.id]={image,outline,alpha:x.getImageData(0,0,p.w,p.h).data};}));let under=null;if(data.face.underlay){const p=data.face.underlay,image=await load(p.src);if(image.naturalWidth!==p.w||image.naturalHeight!==p.h)throw Error('面部底色备份尺寸错误');under={...p,image};}assets=next;faceUnderlay=under;}
function editable(p){return !!p;}
function neighbors(p){return ordered().filter(q=>q.id!==p.id&&(p.category==='expression'?q.id===data.face.base_part:p.id===data.face.base_part||q.category!=='expression'));}
function renderMaskTools(){
 if(!editable(current()))maskEditing=false;
 $('maskTools').hidden=!maskEditing;$('editMask').disabled=!editable(current());$('editMask').classList.toggle('active',maskEditing);$('editMask').setAttribute('aria-pressed',String(maskEditing));
 const others=neighbors(current());
 if(!others.some(p=>p.id===neighbor))neighbor=others[0]?.id||'';
 $('maskNeighbor').replaceChildren();for(const p of others){const o=document.createElement('option');o.value=p.id;o.textContent=p.label;$('maskNeighbor').appendChild(o);}$('maskNeighbor').value=neighbor;
 const expression=current().category==='expression',facePair=expression||(selected===data.face.base_part&&data.face.feature_ids.includes(neighbor));
 $('brushAdd').textContent=expression?'从面部扩入':'扩入当前层';$('brushErase').textContent=expression?'退回面部':'划给相邻层';$('brushAdd').classList.toggle('active',brushAction==='add');$('brushErase').classList.toggle('active',brushAction==='erase');
 $('maskHelp').textContent=facePair?'表情缩小：将原像素退回面部；表情扩大：从面部取像素，并恢复下面已有的面部底色。其他表情不受影响。Alt 或中键平移，滚轮缩放；松开自动保存，可撤销。':'左键涂抹：仅在当前层与指定相邻层之间转移像素，透明背景受保护。按住 Alt 或中键拖动平移。每笔松开后自动保存，可撤销。';
 viewport.style.cursor=maskEditing?'crosshair':'grab';updateBrushCursor();
}
function updateBrushCursor(){const c=$('brushCursor');c.hidden=!maskEditing||!brushPosition;if(c.hidden)return;c.style.left=brushPosition.x+'px';c.style.top=brushPosition.y+'px';c.style.width=c.style.height=Number($('brushSize').value)*scale+'px';}
function localPoint(e){const r=viewport.getBoundingClientRect();return{x:(e.clientX-r.left-pan.x)/scale,y:(e.clientY-r.top-pan.y)/scale};}
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function beginStroke(e){
 if(assetBusy||stroke||!editable(current())||!neighbor)return;
 const a=current(),b=data.parts.find(p=>p.id===neighbor);if(!editable(b))return;
 if(!neighbors(a).some(p=>p.id===b.id))return;
 const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.max(a.x+a.w,b.x+b.w)-x,h=Math.max(a.y+a.h,b.y+b.h)-y;
 stroke={before:clone(data),a:a.id,b:b.id,x,y,w,h,action:brushAction,radius:Number($('brushSize').value)/2,working:{},last:localPoint(e),touched:false};
 for(const p of[a,b]){const c=makeCanvas(w,h),cx=c.getContext('2d');cx.drawImage(assets[p.id].image,p.x-x,p.y-y);stroke.working[p.id]={image:c,pixels:cx.getImageData(0,0,w,h),x,y,w,h};}
 const feature=[a,b].find(p=>p.category==='expression');
 if(feature){
  const base=data.parts.find(p=>p.id===data.face.base_part),under=data.face.underlay||{src:base.src,x:base.x,y:base.y,w:base.w,h:base.h},image=faceUnderlay?.image||assets[base.id].image;
  const clean=makeCanvas(w,h),cx=clean.getContext('2d');cx.drawImage(image,under.x-x,under.y-y);stroke.cleanPixels=cx.getImageData(0,0,w,h).data;stroke.underlay=under;stroke.underlayImage=image;stroke.feature=feature.id;
  const occupied=makeCanvas(w,h),ox=occupied.getContext('2d');for(const p of data.parts)if(p.category==='expression'&&p.id!==feature.id)ox.drawImage(assets[p.id].image,p.x-x,p.y-y);stroke.otherFeatures=ox.getImageData(0,0,w,h).data;
 }
 paintSegment(stroke.last,stroke.last);renderCheckpoint();
}
function paintSegment(from,to){
 const s=stroke;if(!s)return;const donor=s.working[s.action==='add'?s.b:s.a],receiver=s.working[s.action==='add'?s.a:s.b],radius=s.radius;
 const steps=Math.max(1,Math.ceil(Math.hypot(to.x-from.x,to.y-from.y)/Math.max(1,radius/3)));let moved=false;
 for(let step=0;step<=steps;step++){const t=step/steps,cx=from.x+(to.x-from.x)*t-s.x,cy=from.y+(to.y-from.y)*t-s.y;
  for(let yy=Math.max(0,Math.floor(cy-radius));yy<Math.min(s.h,Math.ceil(cy+radius));yy++)for(let xx=Math.max(0,Math.floor(cx-radius));xx<Math.min(s.w,Math.ceil(cx+radius));xx++){
   if((xx+.5-cx)**2+(yy+.5-cy)**2>radius**2)continue;
   const i=(yy*s.w+xx)*4;if(!donor.pixels.data[i+3])continue;
   if(s.feature){
    const toFeature=receiver===s.working[s.feature];if(toFeature&&(receiver.pixels.data[i+3]||s.otherFeatures[i+3]))continue;
    receiver.pixels.data.set(donor.pixels.data.subarray(i,i+4),i);
    if(toFeature){if(s.cleanPixels[i+3])donor.pixels.data.set(s.cleanPixels.subarray(i,i+4),i);}
    else donor.pixels.data.fill(0,i,i+4);
   }else{if(receiver.pixels.data[i+3])continue;receiver.pixels.data.set(donor.pixels.data.subarray(i,i+4),i);donor.pixels.data.fill(0,i,i+4);}
   moved=true;
  }
 }
 s.last=to;if(!moved)return;s.touched=true;
 for(const a of Object.values(s.working)){a.image.getContext('2d').putImageData(a.pixels,0,0);a.tint=null;}
 draw();
}
function bakedPart(p,a,s){
 const pixels=a.pixels.data;let x0=s.w,y0=s.h,x1=-1,y1=-1;
 for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++)if(pixels[(y*s.w+x)*4+3]){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
 if(x1<0)throw Error('不能把整个部件涂空；请缩小画笔或分段调整');
 const w=x1-x0+1,h=y1-y0+1,c=makeCanvas(w,h),cx=c.getContext('2d');cx.putImageData(a.pixels,-x0,-y0);const rgba=cx.getImageData(0,0,w,h).data,edge=makeCanvas(w,h),ec=edge.getContext('2d'),ed=ec.createImageData(w,h);
 // Chamfer distance gives a stable interior label anchor after the silhouette changes.
 const stride=w+2,dist=new Float32Array((w+2)*(h+2)),large=w+h+1;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)dist[(y+1)*stride+x+1]=rgba[(y*w+x)*4+3]?large:0;
 for(let y=1;y<=h;y++)for(let x=1;x<=w;x++){const i=y*stride+x;if(dist[i])dist[i]=Math.min(dist[i],dist[i-1]+1,dist[i-stride]+1);}
 let best=-1,px=0,py=0;for(let y=h;y>=1;y--)for(let x=w;x>=1;x--){const i=y*stride+x;if(dist[i])dist[i]=Math.min(dist[i],dist[i+1]+1,dist[i+stride]+1);if(dist[i]>best){best=dist[i];px=x-1;py=y-1;}}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let min=255,max=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy,v=xx>=0&&yy>=0&&xx<w&&yy<h&&rgba[(yy*w+xx)*4+3]?255:0;min=Math.min(min,v);max=Math.max(max,v);}const i=(y*w+x)*4;ed.data[i]=ed.data[i+1]=ed.data[i+2]=255;ed.data[i+3]=max-min;}
 ec.putImageData(ed,0,0);const x=s.x+x0,y=s.y+y0;

function endStroke(cancel=false){

function request(endpoint,design){if(!config)return Promise.resolve();pending++;renderCheckpoint();const task=queue.then(async()=>{const r=await fetch(config.base_url+endpoint,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':config.token},body:JSON.stringify({run_id:config.run_id,revision,design})});const j=await r.json();if(!r.ok)throw Error(j.error||'保存失败');revision=j.revision;reviewState=j.status;error='';return j;});queue=task.catch(e=>{error=e.message;reviewState='awaiting_review';}).finally(()=>{pending--;if(!pending&&!error)dirty=false;renderCheckpoint();});return task;}

function edit(fn,message){const prev=clone(data);try{fn();validate(data);undo.push(prev);if(undo.length>80)undo.shift();redo=[];changed();render();status(message||'已更新切片检查结果。');}catch(e){data=prev;render();status('未应用：'+e.message);}}
async function history(back){if(assetBusy||stroke)return;const from=back?undo:redo,to=back?redo:undo;if(!from.length)return;const prev=clone(data),next=from.at(-1);assetBusy=true;document.body.classList.add('asset-busy');renderCheckpoint();try{data=next;await loadAssets();from.pop();to.push(prev);changed();render();status(back?'已撤销，切片与轮廓已还原':'已重做，切片与轮廓已更新');}catch(e){data=prev;await loadAssets();render();status('无法恢复：'+e.message);}finally{assetBusy=false;document.body.classList.remove('asset-busy');renderCheckpoint();}}

function fitRegion(region=null){roi=region;fitView=true;if(!original)return;const r=viewport.getBoundingClientRect(),b=region||[0,0,data.image.width,data.image.height];scale=Math.max(.005,Math.min((r.width-70)/(b[2]-b[0]),(r.height-70)/(b[3]-b[1])));pan={x:(r.width-(b[2]-b[0])*scale)/2-b[0]*scale,y:(r.height-(b[3]-b[1])*scale)/2-b[1]*scale};draw();}
function zoomAt(factor,x,y){fitView=false;const s=Math.max(.005,Math.min(30,scale*factor));pan.x=x-(x-pan.x)*s/scale;pan.y=y-(y-pan.y)*s/scale;scale=s;draw();}

 if(showNumbers&&mode!=='original'){ctx.setTransform(dpr,0,0,dpr,0,0);const badges=[];for(const p of ps){const point={x:pan.x+p.label_point[0]*scale,y:pan.y+p.label_point[1]*scale};let x=point.x,y=point.y;const candidates=[[0,0],[22,0],[-22,0],[0,22],[0,-22],[22,22],[-22,-22],[40,0],[-40,0],[0,40],[0,-40]];for(const [dx,dy]of candidates){x=point.x+dx;y=point.y+dy;if(badges.every(b=>Math.hypot(b.x-x,b.y-y)>22))break;}badges.push({x,y,id:p.id});if(x!==point.x||y!==point.y){ctx.strokeStyle=p.color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(point.x,point.y);ctx.lineTo(x,y);ctx.stroke();}ctx.fillStyle=p.color;ctx.strokeStyle=p.id===selected?'#173f2f':'white';ctx.lineWidth=p.id===selected?3:2;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='white';ctx.font='bold 10px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(data.order.indexOf(p.id)+1),x,y+.4);}canvas._badges=badges;}else canvas._badges=[];

function render(){
