<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>补全与SVG结果检查</title><style>
:root{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;color:#293c32;background:#f0f3ed;--line:#dbe3d5;--green:#22684f;--muted:#71816c}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:white}button:hover{background:#e5eee1}button.active{background:#dbeadc;border-color:#8bac8d}button:disabled{opacity:.4;cursor:default}header{padding:20px 26px;background:#fcfdf9;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--green)}h1{font-size:23px;margin:6px 0 8px}.muted{color:var(--muted);font-size:11px;line-height:1.9}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.checkpoint{padding:12px 26px;background:#e2eddc;border-bottom:1px solid #cedec6}.checkpoint strong{display:block;font-size:13px;margin-bottom:5px}.checkpoint.error{background:#fff0de}button.primary{background:var(--green);color:white;border-color:var(--green)}.tabs{display:flex;gap:7px;padding:16px 26px 12px;align-items:center;flex-wrap:wrap}.tabs input,.tabs select{padding:8px;border:1px solid var(--line);border-radius:6px;background:white}.note{margin:0 26px 16px;border:1px solid #e2d8b7;padding:11px 14px;background:#fff9e8;color:#887144;line-height:1.8;font-size:11px;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 26px 26px;gap:15px}.card{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.card h2{font-size:12px;margin:0;padding:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.cell{background:#fcfdf9;min-width:0}.cell span{display:block;padding:5px 9px;color:var(--muted);font-size:10px}.thumb{width:100%;height:170px;border:0;border-radius:0;padding:10px;display:block}.thumb img{width:100%;height:100%;object-fit:contain}.checker{background-color:#edf0e8;background-image:linear-gradient(45deg,#dfe5d9 25%,transparent 25%),linear-gradient(-45deg,#dfe5d9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dfe5d9 75%),linear-gradient(-45deg,transparent 75%,#dfe5d9 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.card-info{padding:9px 12px;line-height:1.8;font-size:10px;color:var(--muted);min-height:65px}.card-foot{padding:9px 12px;display:flex;justify-content:space-between;gap:5px;border-top:1px solid var(--line);font-size:10px}.card-foot select{max-width:125px;border:1px solid var(--line);border-radius:4px;padding:4px}.card-foot button{padding:4px 7px;font-size:10px}.composite{margin:0 26px 26px;border:1px solid var(--line);border-radius:10px;background:white;overflow:hidden}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px;border-bottom:1px solid var(--line)}.tools label{display:flex;gap:5px;align-items:center;font-size:11px}.tools button{font-size:11px;padding:6px 9px}.canvas-wrap{height:75dvh;min-height:400px;position:relative;overflow:hidden;touch-action:none;cursor:grab}.canvas-wrap canvas{width:100%;height:100%;display:block}.caption{padding:10px 14px;line-height:1.9;font-size:11px;color:var(--muted)}footer{padding:12px 26px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:#fafcf7}dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(1130px,95vw);max-width:none;max-height:94dvh;background:#f9fbf5;color:inherit;box-shadow:0 16px 80px #1c382d55}dialog::backdrop{background:#1b332c66;backdrop-filter:blur(3px)}.dialog-head{padding:14px 18px;background:white;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:16px;margin:0}.dialog-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px}.inspector{background:white;border-left:1px solid var(--line);padding:17px;overflow:auto;max-height:78dvh}.inspector h3{font-size:12px;margin:0 0 8px}.inspector p{font-size:11px;line-height:1.9;color:var(--muted)}.inspector select,.inspector textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;margin:7px 0 15px;font-size:12px}.inspector textarea{min-height:90px;resize:vertical}.inspector hr{border:0;border-top:1px solid var(--line);margin:16px 0}#detailWrap{height:min(65dvh,600px);min-height:320px}.legend{color:#289c80}#error{color:#b14b52}.empty{text-align:center;color:var(--muted);padding:60px;grid-column:1/-1}[hidden]{display:none!important}@media(min-width:1800px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:1150px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:780px){header{padding:16px}.row{flex-direction:column;align-items:flex-start}.checkpoint{padding:12px 16px}.tabs{padding:14px 16px}.grid{padding:0 16px 20px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:145px}.note{margin:0 16px 16px}.composite{margin:0 16px 20px}.dialog-layout{grid-template-columns:1fr}.inspector{border-left:0;border-top:1px solid var(--line);max-height:none}#detailWrap{height:45dvh}.card-foot{flex-wrap:wrap}.card h2{min-height:55px}.card-info{min-height:100px}.canvas-wrap{height:65dvh}h1{font-size:21px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="row"><div><div class="eyebrow">CHARACTER LAB / 04 · REPAIRED MATERIALS</div><h1>补全与局部 SVG · 修复结果检查</h1><p id="title" class="muted"></p></div><div class="actions"><a id="historyLink" href="/review-history.html" target="_blank" style="color:var(--green);padding:8px">流程回看 ↗</a><button id="export">导出检查 JSON</button><button id="downloadZip">下载素材包</button></div></div></header>
<div class="checkpoint row" id="checkpointBar"><div><strong id="checkpointState">正在读取修复素材…</strong><span class="muted" id="checkpointDetail">本页确认的是修复结果，独立于第三阶段的处理计划。</span></div><div class="actions"><button id="retry" hidden>重试保存</button><button class="primary" id="confirmStage" disabled>确认补全与重绘结果</button></div></div>
<div class="tabs"><button class="active" id="galleryTab">逐块前后对照</button><button id="compositeTab">原位合成</button><select id="filter" aria-label="筛选结果"><option value="all">全部部件</option><option value="changed">有改动</option><option value="svg">包含 SVG</option><option value="needs_repair">标记需修订</option><option value="keep">原样保留</option></select><input id="search" placeholder="搜索部件名称或 ID" aria-label="搜索部件"><span id="counts" class="muted"></span></div>
<div id="limitation" class="note"></div><main id="grid" class="grid"></main>
<section class="composite" id="composite" hidden><div class="tools"><button class="active" id="afterComposite">修复后</button><button id="beforeComposite">修复前</button><label><input type="checkbox" id="blankFace">隐藏表情／看空面部</label><label><input type="checkbox" id="showAdded">高亮补全像素</label><button id="fitComposite">适应画面</button><button id="zoomOutComposite">−</button><button id="zoomInComposite">＋</button></div><div id="compositeWrap" class="canvas-wrap checker"><canvas id="compositeCanvas"></canvas></div><div class="caption">绿色为新增的有效像素；透明背景不填色。此预览只检查原位与轻量接缝，不表示已验证所有动画动作。滚轮缩放、拖动平移。</div></section>
<footer id="status" role="status" aria-live="polite">正在载入…</footer>
<dialog id="detail"><div class="dialog-head row"><h2 id="detailTitle"></h2><div class="actions"><button id="previous">← 上一块</button><button id="next">下一块 →</button><button id="close">关闭 ✕</button></div></div><div class="dialog-layout"><section><div class="tools"><button class="active" id="afterMode">修复后</button><button id="beforeMode">修复前</button><label><input type="checkbox" id="context">显示其他部件</label><label><input type="checkbox" id="added">新增</label><label><input type="checkbox" id="removed">移除</label><button id="fitDetail">适应画面</button></div><div class="canvas-wrap checker" id="detailWrap"><canvas id="detailCanvas"></canvas></div><div class="caption"><span class="legend">绿色：新增像素</span> · 红色：移除像素。前后使用同一原图坐标，可缩放和平移。</div></section><aside class="inspector"><h3>结果检查</h3><select id="quality"><option value="pending">待检查</option><option value="accepted">已检查</option><option value="needs_repair">需要修订</option></select><h3>处理记录</h3><p id="method"></p><p id="metrics"></p><hr><h3>设计者备注</h3><textarea id="note" placeholder="例如：脸部色差太大，请修正"></textarea><div class="actions"><button id="downloadPart">下载 PNG</button><button id="downloadSvg">下载 SVG</button></div><hr><p>复杂头发和布料的隐藏区采用原像素延展估计；SVG为真实矢量路径。标记“需要修订”的部件会阻止整阶段确认。</p></aside></div></dialog>
<script id="rig-data" type="application/json">null</script><script id="checkpoint-config" type="application/json">null</script>
<template id="eraseToolbar"><div class="tools" id="eraseTools"><button id="panMode" class="active">平移</button><button id="brushMode">画笔</button><button id="pickerMode">取色</button><button id="eraseMode" aria-pressed="false">橡皮擦</button><label>颜色 <input id="paintColor" type="color" value="#e6c6ba" aria-label="画笔颜色"><span id="colorValue">#e6c6ba</span></label><label>取色来源 <select id="pickSource"><option value="part">当前部件</option><option value="source">原图</option><option value="composite">合成</option></select></label><label>直径 <input id="eraseSize" type="range" min="1" max="80" value="16" style="width:90px"><span id="eraseSizeLabel">16 px</span></label><button id="undoErase" disabled>撤销一笔</button><button id="discardErase" disabled>取消未保存修改</button><button id="saveErase" class="primary" disabled>保存像素修改</button><span id="eraseStatus">编辑当前部件；取色可选当前层／原图／合成，Alt 或中键平移。</span></div></template>
<script>
'use strict';(()=>{
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));let data=JSON.parse($('rig-data').textContent),config=JSON.parse($('checkpoint-config').textContent);if(!data)return;
const parts=new Map(data.parts.map(p=>[p.id,p])),records=new Map(data.repair_results.map(r=>[r.part_id,r])),images={},backgrounds={};
let ready=false,selected=null,after=true,compositeAfter=true,revision=config?.revision??0,state=config?.status||'offline',dirty=false,pending=0,error='',timer=null,queue=Promise.resolve(),confirming=false;
const view={detail:{scale:1,x:0,y:0},composite:{scale:1,x:0,y:0}};
let eraseMode=false,editTool='pan',editMask=null,paintMask=null,sourceImage=null,eraseCanvas=null,eraseDirty=false,eraseUndo=[],eraseBusy=false,eraseError='';
$('detailWrap').before($('eraseToolbar').content.cloneNode(true));
$('title').textContent=data.title;$('limitation').textContent='修复稿 · '+data.limitation;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function load(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('素材读取失败'));im.src=src;});}
function controls(){
 const repair=data.parts.filter(p=>p.quality==='needs_repair').length;
 $('checkpointBar').classList.toggle('error',!!error||repair>0);$('retry').hidden=!error;
 $('confirmStage').disabled=!ready||!config||pending>0||dirty||!!error||repair>0||state==='confirmed'||eraseDirty||eraseBusy;
 $('checkpointState').textContent=error?'保存失败，请重试':repair?repair+' 个部件需要修订':!config?'离线快照 · 不能放行':pending||dirty?'正在保存检查结果…':state==='confirmed'?'修复结果已确认':'等待人工检查修复结果';
 $('checkpointDetail').textContent=error||'确认后才产生本阶段 confirmed.json。当前补全稿尚未做动画验证。';
 for(const n of document.querySelectorAll('select[data-part],#quality,#note'))n.disabled=confirming||eraseBusy||eraseDirty;
 for(const id of ['eraseMode','brushMode','pickerMode','panMode','paintColor','pickSource'])$(id).disabled=!config||!after||pending>0||confirming||eraseBusy;
 $('saveErase').disabled=!eraseDirty||eraseBusy||pending>0||dirty||!!error;
 $('undoErase').disabled=!eraseUndo.length||eraseBusy;$('discardErase').disabled=!eraseDirty||eraseBusy;
 $('eraseSize').disabled=!config||eraseBusy;$('downloadZip').disabled=eraseDirty||eraseBusy;
 $('downloadPart').disabled=eraseDirty||eraseBusy;$('export').disabled=eraseDirty||eraseBusy;
 if(selected){const r=records.get(selected);$('downloadSvg').disabled=eraseDirty||eraseBusy||!r.svg_source||!!r.svg_raster_edited;}
 $('eraseStatus').textContent=eraseError||(eraseBusy?'正在保存PNG与素材包…':eraseDirty?'有未保存像素修改，请点击「保存像素修改」':!config?'只读快照；返回当前结果页才能编辑':'编辑当前部件；取色可选当前层／原图／合成，Alt 或中键平移。');
}
async function request(path,snapshot){const response=await fetch(config.base_url+path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':config.token},body:JSON.stringify({run_id:config.run_id,revision,design:snapshot})});const r=await response.json();if(!response.ok)throw Error(r.error||'保存失败');revision=r.revision;state=r.status;}
function flush(){clearTimeout(timer);timer=null;if(!config||!dirty)return queue;const snapshot=clone(data);dirty=false;pending++;controls();queue=queue.then(async()=>{if(error)throw Error(error);await request('/api/draft',snapshot);}).catch(e=>{error=e.message;dirty=true;}).finally(()=>{pending--;controls();if(!error&&!dirty&&!pending)$('status').textContent='检查结果已保存。';});return queue;}
function change(p){p.review='adjusted';data.face.review='adjusted';dirty=true;state='awaiting_review';clearTimeout(timer);if(config)timer=setTimeout(flush,350);controls();}
function setQuality(id,value){if(confirming)return;const p=parts.get(id);p.quality=value;change(p);renderGrid();if(selected===id)$('quality').value=value;}
function renderGrid(){const filter=$('filter').value,term=$('search').value.toLowerCase();const ids=data.order.filter(id=>{const p=parts.get(id),r=records.get(id);return(p.label+' '+id).toLowerCase().includes(term)&&(filter==='all'||filter==='changed'&&r.changed_pixels>0||filter==='svg'&&!!r.svg_source||filter==='needs_repair'&&p.quality==='needs_repair'||filter==='keep'&&r.changed_pixels===0);});$('grid').replaceChildren();$('counts').textContent=ids.length+' / '+data.parts.length+' 部件';
 if(!ids.length)$('grid').append(el('div','empty','没有符合条件的部件。'));
 for(const id of ids){const p=parts.get(id),r=records.get(id),card=el('article','card');card.dataset.part=id;card.append(el('h2','',(data.order.indexOf(id)+1)+' · '+p.label));const pair=el('div','pair');
 for(const [label,src]of[['修复前',r.before.src],['修复后',p.src]]){const cell=el('div','cell'),thumb=el('button','thumb checker');thumb.onclick=()=>open(id);thumb.setAttribute('aria-label',label+' '+p.label);const img=new Image();img.src=src;img.alt=label+' '+p.label;img.loading='lazy';thumb.append(img);cell.append(el('span','',label),thumb);pair.append(cell);}card.append(pair);
 card.append(el('div','card-info',(r.svg_source?'SVG + 位图 · ':'')+(r.changed_pixels?'新增 '+r.added_pixels+' px · 移除 '+r.removed_pixels+' px':'原样保留')+'\n'+r.method));
 const foot=el('div','card-foot'),select=document.createElement('select');select.dataset.part=id;select.setAttribute('aria-label',p.label+'检查状态');for(const[v,t]of[['pending','待检查'],['accepted','已检查'],['needs_repair','需要修订']]){const option=el('option','',t);option.value=v;select.append(option);}select.value=p.quality;select.onchange=()=>setQuality(id,select.value);const button=el('button','','放大与备注 ↗');button.onclick=()=>open(id);foot.append(select,button);card.append(foot);$('grid').append(card);
 }controls();}
function open(id){if(eraseDirty||eraseBusy){$('eraseStatus').textContent='请先保存或取消当前修改';return;}selected=id;eraseCanvas=null;eraseUndo=[];const p=parts.get(id),r=records.get(id);$('detailTitle').textContent=p.label+' · '+id;$('quality').value=p.quality;$('note').value=p.note;$('method').textContent=r.method+(r.svg_raster_edited?'；PNG已人工编辑，SVG路径未同步修改。':'');$('metrics').textContent='新增 '+r.added_pixels+' px；移除 '+r.removed_pixels+' px。修复后裁切 '+p.w+' × '+p.h+'，偏移 ('+p.x+', '+p.y+')。';$('downloadSvg').disabled=!r.svg_source||!!r.svg_raster_edited;$('previous').disabled=data.order.indexOf(id)===0;$('next').disabled=data.order.indexOf(id)===data.order.length-1;if(!$('detail').open)$('detail').showModal();controls();requestAnimationFrame(()=>fit('detail'));}
function fit(name){const v=view[name],wrap=$(name+'Wrap');let b=[0,0,data.image.width,data.image.height];if(name==='detail'&&selected){const p=parts.get(selected),q=records.get(selected).before;b=[Math.min(p.x,q.x)-10,Math.min(p.y,q.y)-10,Math.max(p.x+p.w,q.x+q.w)+10,Math.max(p.y+p.h,q.y+q.h)+10];}const w=b[2]-b[0],h=b[3]-b[1];v.scale=Math.min((wrap.clientWidth-30)/w,(wrap.clientHeight-30)/h);v.x=(wrap.clientWidth-w*v.scale)/2-b[0]*v.scale;v.y=(wrap.clientHeight-h*v.scale)/2-b[1]*v.scale;draw(name);}
function layer(ctx,id,isAfter){const p=isAfter?parts.get(id):records.get(id).before;ctx.drawImage(images[id][isAfter?'after':'before'],p.x,p.y,p.w,p.h);}
function draw(name){if(!ready||name==='detail'&&!selected)return;const c=$(name+'Canvas'),wrap=$(name+'Wrap'),v=view[name],dpr=devicePixelRatio||1;c.width=Math.round(wrap.clientWidth*dpr);c.height=Math.round(wrap.clientHeight*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.translate(v.x,v.y);ctx.scale(v.scale,v.scale);
 if(name==='composite'){for(const id of data.order){if($('blankFace').checked&&data.face.feature_ids.includes(id))continue;layer(ctx,id,compositeAfter);}if($('showAdded').checked)for(const id of data.order)ctx.drawImage(images[id].added,0,0);}
 else{if($('context').checked){ctx.globalAlpha=.22;for(const id of data.order)if(id!==selected)layer(ctx,id,after);ctx.globalAlpha=1;}if(after&&eraseCanvas){const p=parts.get(selected);ctx.drawImage(eraseCanvas,0,0);}else layer(ctx,selected,after);if($('added').checked)ctx.drawImage(images[selected].added,0,0);if($('removed').checked)ctx.drawImage(images[selected].removed,0,0);}}
function zoom(name,factor,x,y){const v=view[name],wrap=$(name+'Wrap');x??=wrap.clientWidth/2;y??=wrap.clientHeight/2;const next=Math.max(.08,Math.min(20,v.scale*factor)),ratio=next/v.scale;v.x=x-(x-v.x)*ratio;v.y=y-(y-v.y)*ratio;v.scale=next;draw(name);}
function erasePoint(e){const r=$('detailWrap').getBoundingClientRect(),v=view.detail,p=parts.get(selected);return{x:(e.clientX-r.left-v.x)/v.scale,y:(e.clientY-r.top-v.y)/v.scale};}
function newCanvas(){const c=document.createElement('canvas');c.width=data.image.width;c.height=data.image.height;return c;}
function ensureEdit(){if(eraseCanvas)return;eraseCanvas=newCanvas();const p=parts.get(selected);eraseCanvas.getContext('2d').drawImage(images[selected].after,p.x,p.y);editMask=newCanvas();paintMask=newCanvas();}
function setTool(tool){editTool=tool;eraseMode=tool==='eraser';for(const [id,key]of [['panMode','pan'],['brushMode','brush'],['pickerMode','picker'],['eraseMode','eraser']]){const on=tool===key;$(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',on);} $('detailWrap').style.cursor=tool==='pan'?'grab':'crosshair';$('added').checked=false;$('removed').checked=false;draw('detail');}
function stamp(ctx,a,b,operation,color){ctx.globalCompositeOperation=operation;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=Number($('eraseSize').value);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';}
function eraseSegment(a,b){eraseError='';stamp(eraseCanvas.getContext('2d'),a,b,eraseMode?'destination-out':'source-over',$('paintColor').value);stamp(editMask.getContext('2d'),a,b,'source-over','#fff');if(!eraseMode)stamp(paintMask.getContext('2d'),a,b,'source-over','#fff');eraseDirty=true;draw('detail');controls();}
function pickColor(point){const c=newCanvas(),ctx=c.getContext('2d');if($('pickSource').value==='source')ctx.drawImage(sourceImage,0,0);else if($('pickSource').value==='composite'){for(const id of data.order){if(id===selected&&eraseCanvas)ctx.drawImage(eraseCanvas,0,0);else layer(ctx,id,true);}}else if(eraseCanvas)ctx.drawImage(eraseCanvas,0,0);else layer(ctx,selected,true);const x=Math.floor(point.x),y=Math.floor(point.y);if(x<0||y<0||x>=c.width||y>=c.height)return;const rgba=ctx.getImageData(x,y,1,1).data;if(!rgba[3]){$('eraseStatus').textContent='这里是透明像素，请选有颜色的区域。';return;}const hex='#'+Array.from(rgba.slice(0,3),n=>n.toString(16).padStart(2,'0')).join('');$('paintColor').value=hex;$('colorValue').textContent=hex;setTool('brush');$('eraseStatus').textContent='已取色 '+hex+'，已切换画笔。';}
for(const name of ['detail','composite']){const wrap=$(name+'Wrap');let drag=null;wrap.onwheel=e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoom(name,e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);};wrap.onpointerdown=e=>{if(eraseBusy||![0,1].includes(e.button))return;e.preventDefault();if(name==='detail'&&editTool!=='pan'&&after&&config&&e.button===0&&!e.altKey){if(editTool==='picker'){pickColor(erasePoint(e));return;}if(pending||dirty||error||confirming)return;ensureEdit();eraseUndo.push({pixels:eraseCanvas.getContext('2d').getImageData(0,0,eraseCanvas.width,eraseCanvas.height),mask:editMask.getContext('2d').getImageData(0,0,eraseCanvas.width,eraseCanvas.height),paint:paintMask.getContext('2d').getImageData(0,0,eraseCanvas.width,eraseCanvas.height),dirty:eraseDirty});if(eraseUndo.length>8)eraseUndo.shift();drag={erase:true,last:erasePoint(e)};eraseSegment(drag.last,drag.last);}else drag={x:e.clientX,y:e.clientY,pan:{...view[name]}};wrap.setPointerCapture(e.pointerId);};wrap.onpointermove=e=>{if(!drag)return;if(drag.erase){const next=erasePoint(e);eraseSegment(drag.last,next);drag.last=next;return;}view[name].x=drag.pan.x+e.clientX-drag.x;view[name].y=drag.pan.y+e.clientY-drag.y;draw(name);};wrap.onpointerup=wrap.onpointercancel=()=>drag=null;}
$('galleryTab').onclick=()=>{$('grid').hidden=false;$('composite').hidden=true;$('galleryTab').classList.add('active');$('compositeTab').classList.remove('active');};$('compositeTab').onclick=()=>{$('grid').hidden=true;$('composite').hidden=false;$('galleryTab').classList.remove('active');$('compositeTab').classList.add('active');requestAnimationFrame(()=>fit('composite'));};
$('search').oninput=renderGrid;$('filter').onchange=renderGrid;$('close').onclick=()=>{if(eraseDirty||eraseBusy){$('eraseStatus').textContent='请先保存或取消当前修改';return;}$('detail').close();};$('detail').addEventListener('cancel',e=>{if(eraseDirty||eraseBusy)e.preventDefault();});$('previous').onclick=()=>open(data.order[data.order.indexOf(selected)-1]);$('next').onclick=()=>open(data.order[data.order.indexOf(selected)+1]);
for(const[id,value]of[['afterMode',true],['beforeMode',false]])$(id).onclick=()=>{after=value;$('afterMode').classList.toggle('active',value);$('beforeMode').classList.toggle('active',!value);draw('detail');controls();};
for(const[id,value]of[['afterComposite',true],['beforeComposite',false]])$(id).onclick=()=>{compositeAfter=value;$('afterComposite').classList.toggle('active',value);$('beforeComposite').classList.toggle('active',!value);draw('composite');};
for(const id of ['context','added','removed'])$(id).onchange=()=>draw('detail');for(const id of ['blankFace','showAdded'])$(id).onchange=()=>draw('composite');$('fitDetail').onclick=()=>fit('detail');$('fitComposite').onclick=()=>fit('composite');$('zoomOutComposite').onclick=()=>zoom('composite',.8);$('zoomInComposite').onclick=()=>zoom('composite',1.25);
$('quality').onchange=()=>setQuality(selected,$('quality').value);$('note').oninput=()=>{if(confirming)return;const p=parts.get(selected);p.note=$('note').value;change(p);};
for(const [id,tool]of [['panMode','pan'],['brushMode','brush'],['pickerMode','picker'],['eraseMode','eraser']])$(id).onclick=()=>setTool(tool);$('paintColor').oninput=()=>$('colorValue').textContent=$('paintColor').value;$('eraseSize').oninput=()=>$('eraseSizeLabel').textContent=$('eraseSize').value+' px';
$('undoErase').onclick=()=>{if(!eraseUndo.length||eraseBusy)return;eraseError='';const last=eraseUndo.pop();eraseCanvas.getContext('2d').putImageData(last.pixels,0,0);editMask.getContext('2d').putImageData(last.mask,0,0);paintMask.getContext('2d').putImageData(last.paint,0,0);eraseDirty=last.dirty;if(!eraseDirty)eraseCanvas=null;draw('detail');controls();};
$('discardErase').onclick=()=>{eraseCanvas=null;eraseUndo=[];eraseDirty=false;eraseError='';draw('detail');controls();};
$('saveErase').onclick=async()=>{if(!config||!eraseDirty||eraseBusy||pending||dirty||error)return;eraseBusy=true;eraseError='';controls();try{const response=await fetch(config.base_url+'/api/paint',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':config.token},body:JSON.stringify({run_id:config.run_id,revision,part_id:selected,png:eraseCanvas.toDataURL('image/png'),mask:editMask.toDataURL('image/png'),paint_mask:paintMask.toDataURL('image/png')})});const r=await response.json();if(!response.ok)throw Error(r.error||'像素保存失败');data=r.design;revision=r.revision;state=r.status;parts.clear();records.clear();for(const p of data.parts)parts.set(p.id,p);for(const row of data.repair_results)records.set(row.part_id,row);const p=parts.get(selected),row=records.get(selected);[images[selected].after,images[selected].added,images[selected].removed]=await Promise.all([p.src,row.added_src,row.removed_src].map(load));eraseCanvas=null;eraseUndo=[];eraseDirty=false;eraseBusy=false;renderGrid();open(selected);$('status').textContent='像素修改已保存，PNG与素材包已更新；请重新检查此部件。';}catch(e){eraseError=e.message;$('status').textContent='未保存：'+e.message;}finally{eraseBusy=false;controls();}};
function download(href,name){const a=document.createElement('a');a.href=href;a.download=name;a.click();}
function textDownload(text,type,name){const url=URL.createObjectURL(new Blob([text],{type}));download(url,name);setTimeout(()=>URL.revokeObjectURL(url),10000);}
$('downloadPart').onclick=()=>download(parts.get(selected).src,selected+'.png');$('downloadSvg').onclick=()=>textDownload(records.get(selected).svg_source,'image/svg+xml',selected+'.svg');$('downloadZip').onclick=()=>download(data.bundle,'repaired-materials.zip');$('export').onclick=()=>textDownload(JSON.stringify(data,null,2),'application/json','material-result-review.json');$('retry').onclick=()=>{if(pending)return;error='';dirty=true;flush();};
$('confirmStage').onclick=async()=>{if(!config||pending||dirty||eraseDirty||eraseBusy||error||state==='confirmed'||data.parts.some(p=>p.quality==='needs_repair'))return;pending++;confirming=true;controls();try{const approved=clone(data);for(const p of approved.parts){p.quality='accepted';p.review='confirmed';}approved.face.review='confirmed';await request('/api/confirm',approved);data=approved;parts.clear();for(const p of data.parts)parts.set(p.id,p);renderGrid();$('status').textContent='修复结果 confirmed.json 已保存。';}catch(e){error=e.message;}finally{pending--;confirming=false;controls();}};
window.addEventListener('resize',()=>{if($('detail').open)fit('detail');if(!$('composite').hidden)fit('composite');});window.addEventListener('beforeunload',e=>{if(config&&(dirty||pending||eraseDirty||eraseBusy)){e.preventDefault();e.returnValue='';}});
Promise.all([load(data.image.src).then(im=>sourceImage=im),...data.parts.map(async p=>{const r=records.get(p.id);const[before,after,added,removed]=await Promise.all([r.before.src,p.src,r.added_src,r.removed_src].map(load));images[p.id]={before,after,added,removed};})]).then(()=>{ready=true;renderGrid();$('status').textContent='已载入 '+data.parts.length+' 个修复前后对照。SVG、PNG与裁切坐标均已保存。';}).catch(e=>{error=e.message;controls();});
})();</script></body></html>
